services:

  web:
    build: .
    container_name: omnibuy-web
    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      db:
        condition: service_healthy


  db:
    image: mysql:8.0
    container_name: omnibuy-db

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init/omnibuy_database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    # Run a real query over TCP as the app user. `mysqladmin ping` over the
    # local socket also succeeds against the temporary server MySQL runs while
    # importing the init scripts, so the db was reported healthy before the
    # schema and seed data were loaded.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: omnibuy-phpmyadmin

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db

    depends_on:
      db:
        condition: service_healthy


volumes:
  mysql_data:
