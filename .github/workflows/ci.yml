name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

jobs:
  validate:
    name: Validate PHP syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          find . \
            -name "*.php" \
            -not -path "./.git/*" \
            -print0 |
          xargs -0 -n1 php -l

  build:
    name: Build Docker image
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(cat VERSION)
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $FULL_VERSION"

      - name: Build Docker image
        run: |
          docker build \
            -t omnibuy:${{ steps.version.outputs.full_version }} \
            .

  test:
    name: Run stack, database validation, and smoke test
    needs: build
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: omnibuy_test
      MYSQL_USER: omnibuy_user
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: test_root_password

    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: |
          docker compose up -d --build

      - name: Wait for database to be healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' omnibuy-db 2>/dev/null || echo "starting")

            if [ "$status" = "healthy" ]; then
              echo "Database is healthy"
              exit 0
            fi

            echo "Waiting for database... ($status)"
            sleep 3
          done

          echo "Database did not become healthy in time"
          docker compose logs
          exit 1
      
      - name: Test MySQL connection
        run: |
          docker exec omnibuy-db sh -c \
            'mysql -u root -p"$MYSQL_ROOT_PASSWORD" -D "$MYSQL_DATABASE" -e "SHOW TABLES;"'

      - name: Validate database initialization
        run: |
          echo "Checking that database exists..."

          DATABASE_FOUND=$(docker exec omnibuy-db \
            mysql \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -Nse "SELECT SCHEMA_NAME
                  FROM INFORMATION_SCHEMA.SCHEMATA
                  WHERE SCHEMA_NAME = '$MYSQL_DATABASE';")

          if [ "$DATABASE_FOUND" != "$MYSQL_DATABASE" ]; then
            echo "Database '$MYSQL_DATABASE' was not created."
            exit 1
          fi

          echo "Database '$MYSQL_DATABASE' exists."

          echo "Checking required schema tables..."

          REQUIRED_TABLES="
          users
          seller_profiles
          categories
          listings
          listing_images
          listing_price_history
          bids
          search_history
          listing_views
          carts
          cart_items
          addresses
          orders
          order_items
          user_reviews
          listing_reviews
          wishlist_items
          conversations
          messages
          user_blocks
          user_reports
          "

          for table in $REQUIRED_TABLES; do
            TABLE_FOUND=$(docker exec omnibuy-db \
              mysql \
              -h 127.0.0.1 \
              -u root \
              -p"$MYSQL_ROOT_PASSWORD" \
              -D "$MYSQL_DATABASE" \
              -Nse "SHOW TABLES LIKE '$table';")

            if [ "$TABLE_FOUND" != "$table" ]; then
              echo "Missing required table: $table"
              exit 1
            fi

            echo "Found table: $table"
          done

          echo "Database schema initialized successfully."

      - name: Smoke test web container
        run: |
          for i in $(seq 1 10); do
            if curl -sSf http://localhost:8080/ -o /dev/null; then
              echo "Web container responded successfully"
              exit 0
            fi

            echo "Waiting for web container..."
            sleep 3
          done

          echo "Web container did not respond in time"
          docker compose logs
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --remove-orphans
