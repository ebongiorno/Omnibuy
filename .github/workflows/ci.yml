name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

jobs:
  validate:
    name: Validate PHP syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          find . \
            -name "*.php" \
            -not -path "./.git/*" \
            -print0 |
          xargs -0 -n1 php -l

  build:
    name: Build Docker image
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(cat VERSION)
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $FULL_VERSION"

      - name: Build Docker image
        run: |
          docker build \
            -t omnibuy:${{ steps.version.outputs.full_version }} \
            .

  test:
    name: Run stack, database validation, and smoke test
    needs: build
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: omnibuy_test
      MYSQL_USER: omnibuy_user
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: test_root_password

    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: |
          docker compose up -d --build

      - name: Wait for database to be healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' omnibuy-db 2>/dev/null || echo "starting")

            if [ "$status" = "healthy" ]; then
              echo "Database is healthy"
              exit 0
            fi

            echo "Waiting for database... ($status)"
            sleep 3
          done

          echo "Database did not become healthy in time"
          docker compose logs
          exit 1
      
      - name: Wait for MySQL TCP connection
        run: |
          echo "Waiting for MySQL TCP connection..."

          for i in $(seq 1 30); do
            if docker exec omnibuy-db \
              mysqladmin \
              --protocol=TCP \
              -h 127.0.0.1 \
              -u root \
              -p"$MYSQL_ROOT_PASSWORD" \
              ping --silent
            then
              echo "MySQL TCP connection is ready."
              exit 0
            fi

            echo "Waiting for MySQL TCP... attempt $i/30"
            sleep 3
          done

          echo "MySQL did not become available over TCP."

          docker compose logs --no-color
          exit 1
      
      - name: Test MySQL connection
        run: |
          docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -e "SHOW TABLES;"

      - name: Validate database initialization
        run: |
          echo "Checking that database exists..."

          DATABASE_FOUND=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -Nse \
            "SELECT SCHEMA_NAME
            FROM INFORMATION_SCHEMA.SCHEMATA
            WHERE SCHEMA_NAME = '$MYSQL_DATABASE';")

          if [ "$DATABASE_FOUND" != "$MYSQL_DATABASE" ]; then
            echo "Database '$MYSQL_DATABASE' was not created."
            exit 1
          fi

          echo "Database '$MYSQL_DATABASE' exists."

          echo "Checking required schema tables..."

          REQUIRED_TABLES="
          users
          password_resets
          seller_profiles
          categories
          listings
          listing_images
          listing_price_history
          bids
          search_history
          listing_views
          carts
          cart_items
          addresses
          orders
          order_items
          user_reviews
          listing_reviews
          wishlist_items
          conversations
          messages
          user_blocks
          user_reports
          "

          for table in $REQUIRED_TABLES; do
            echo "Checking table: $table"

            TABLE_FOUND=$(docker exec omnibuy-db \
              mysql \
              --protocol=TCP \
              -h 127.0.0.1 \
              -u root \
              -p"$MYSQL_ROOT_PASSWORD" \
              -D "$MYSQL_DATABASE" \
              -Nse \
              "SHOW TABLES LIKE '$table';")

            if [ "$TABLE_FOUND" != "$table" ]; then
              echo "Missing required table: $table"
              exit 1
            fi

            echo "Found table: $table"
          done

          echo "Database schema initialized successfully."

      - name: Validate seed data
        run: |
          echo "Checking seeded database contents..."

          USER_COUNT=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT COUNT(*) FROM users;")

          LISTING_COUNT=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT COUNT(*) FROM listings;")

          ACTIVE_LISTING_COUNT=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT COUNT(*)
             FROM listings
             WHERE listing_status = 'active';")

          if [ "$USER_COUNT" -lt 1 ]; then
            echo "Seed validation failed: no users found."
            exit 1
          fi

          if [ "$LISTING_COUNT" -lt 1 ]; then
            echo "Seed validation failed: no listings found."
            exit 1
          fi

          if [ "$ACTIVE_LISTING_COUNT" -lt 1 ]; then
            echo "Seed validation failed: no active listings found."
            exit 1
          fi

          echo "Seed validation passed."
          echo "Users: $USER_COUNT"
          echo "Listings: $LISTING_COUNT"
          echo "Active listings: $ACTIVE_LISTING_COUNT"

      - name: Marketplace Discovery smoke test
        run: |
          echo "Running Marketplace Discovery smoke test..."

          ACTIVE_LISTING_COUNT=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT COUNT(*)
             FROM listings
             WHERE listing_status = 'active';")

          if [ "$ACTIVE_LISTING_COUNT" -lt 1 ]; then
            echo "Smoke test failed:"
            echo "Marketplace Discovery has no active listings."
            exit 1
          fi

          echo "Found $ACTIVE_LISTING_COUNT active listings."

          SAMPLE_LISTING=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT CONCAT(
                 l.listing_id,
                 ' | ',
                 l.item_name,
                 ' | ',
                 COALESCE(c.category_name, 'No Category')
             )
             FROM listings AS l
             LEFT JOIN categories AS c
               ON l.category_id = c.category_id
             WHERE l.listing_status = 'active'
             ORDER BY l.listing_id ASC
             LIMIT 1;")

          if [ -z "$SAMPLE_LISTING" ]; then
            echo "Smoke test failed:"
            echo "Unable to retrieve an active Marketplace Discovery listing."
            exit 1
          fi

          echo "Successfully retrieved active listing:"
          echo "$SAMPLE_LISTING"

          echo "Marketplace Discovery smoke test passed."

      - name: Run automated PHP tests
        run: |
          shopt -s nullglob
          failures=0

          for test_file in tests/*-test.php; do
            echo "=== Running $test_file ==="

            if ! docker compose exec -T web php "$test_file"; then
              echo "FAILED: $test_file"
              failures=1
            fi

            echo
          done

          if [ "$failures" -ne 0 ]; then
            echo "One or more PHP tests failed."
            exit 1
          fi

          echo "All PHP tests passed."

      - name: Install Composer dependencies
        run: |
          docker compose exec -T web composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit tests
        run: |
          docker compose exec -T web vendor/bin/phpunit \
            --testdox \
            --log-junit build/phpunit-junit.xml

      - name: Upload PHPUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results
          path: build/phpunit-junit.xml
          if-no-files-found: ignore

      - name: Smoke test web container
        run: |
          for i in $(seq 1 10); do
            if curl -sSf http://localhost:8080/ -o /dev/null; then
              echo "Web container responded successfully"
              exit 0
            fi

            echo "Waiting for web container..."
            sleep 3
          done

          echo "Web container did not respond in time"
          docker compose logs
          exit 1
      
      - name: Test Marketplace Discovery features and regression baseline
        run: |
          echo "Running Marketplace Discovery feature and regression tests..."

          failures=0

          # =========================================
          # Get predictable seeded test data
          # =========================================

          SAMPLE_ITEM=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT item_name
             FROM listings
             WHERE listing_status = 'active'
             ORDER BY listing_id ASC
             LIMIT 1;")

          BROWSE_ITEM=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT item_name
             FROM listings
             WHERE listing_status = 'active'
             ORDER BY created_at DESC, listing_id DESC
             LIMIT 1;")

          SAMPLE_SELLER=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT sp.store_name
             FROM seller_profiles AS sp
             INNER JOIN users AS u
               ON sp.user_id = u.user_id
             WHERE u.account_status = 'active'
             ORDER BY sp.user_id ASC
             LIMIT 1;")

          SAMPLE_SELLER_USER_ID=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT sp.user_id
             FROM seller_profiles AS sp
             INNER JOIN users AS u
               ON sp.user_id = u.user_id
             WHERE u.account_status = 'active'
             ORDER BY sp.user_id ASC
             LIMIT 1;")

          INACTIVE_ITEM=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT item_name
             FROM listings
             WHERE listing_status <> 'active'
             ORDER BY listing_id ASC
             LIMIT 1;")

          INACTIVE_SELLER=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT sp.store_name
             FROM seller_profiles AS sp
             INNER JOIN users AS u
               ON sp.user_id = u.user_id
             WHERE u.account_status <> 'active'
             ORDER BY sp.user_id ASC
             LIMIT 1;")

          # =========================================
          # Validate required regression fixtures
          # =========================================

          if [ -z "$SAMPLE_ITEM" ]; then
            echo "FAILED: No active seeded listing available for Item Search test."
            exit 1
          fi

          if [ -z "$BROWSE_ITEM" ]; then
            echo "FAILED: No active seeded listing available for Browse Feed test."
            exit 1
          fi

          if [ -z "$SAMPLE_SELLER" ]; then
            echo "FAILED: No active seeded seller available for Seller Search test."
            exit 1
          fi

          if [ -z "$SAMPLE_SELLER_USER_ID" ]; then
            echo "FAILED: Unable to determine seeded seller user ID."
            exit 1
          fi

          # Build partial search values from known-good fixtures.
          PARTIAL_ITEM=$(printf '%s' "$SAMPLE_ITEM" | cut -d' ' -f1)
          PARTIAL_SELLER=$(printf '%s' "$SAMPLE_SELLER" | cut -c1-4)

          echo "Using seeded item for Item Search: $SAMPLE_ITEM"
          echo "Using seeded item for Browse Feed: $BROWSE_ITEM"
          echo "Using seeded seller: $SAMPLE_SELLER"
          echo "Using partial item query: $PARTIAL_ITEM"
          echo "Using partial seller query: $PARTIAL_SELLER"

          # =========================================
          # UC-16: Browse Feed
          # =========================================

          echo
          echo "=== Testing Browse Feed ==="

          BROWSE_RESPONSE=$(curl -sSf \
            http://localhost:8080/)

          if printf '%s' "$BROWSE_RESPONSE" |
            grep -Fq "$BROWSE_ITEM"
          then
            echo "PASSED: Browse Feed displays an active seeded listing."
          else
            echo "FAILED: Browse Feed did not display expected listing: $BROWSE_ITEM"
            failures=1
          fi

          # =========================================
          # UC-16: Inactive listings excluded
          # =========================================

          echo
          echo "=== Testing inactive listing exclusion ==="

          if [ -n "$INACTIVE_ITEM" ]; then
            if printf '%s' "$BROWSE_RESPONSE" |
              grep -Fq "$INACTIVE_ITEM"
            then
              echo "FAILED: Browse Feed displayed inactive listing: $INACTIVE_ITEM"
              failures=1
            else
              echo "PASSED: Browse Feed excludes inactive listings."
            fi
          else
            echo "SKIPPED: No inactive seeded listing available."
          fi

          # =========================================
          # UC-16: Browse All
          # =========================================

          echo
          echo "=== Testing Browse All ==="

          BROWSE_ALL_RESPONSE=$(curl -sSfG \
            --data-urlencode "browse=all" \
            --data-urlencode "search_type=items" \
            http://localhost:8080/pages/search.php)

          if printf '%s' "$BROWSE_ALL_RESPONSE" |
            grep -Fq "$SAMPLE_ITEM"
          then
            echo "PASSED: Browse All displays an active seeded listing."
          else
            echo "FAILED: Browse All did not display expected listing: $SAMPLE_ITEM"
            failures=1
          fi

          # =========================================
          # UC-17: Item Search - success
          # =========================================

          echo
          echo "=== Testing Item Search ==="

          ITEM_RESPONSE=$(curl -sSfG \
            --data-urlencode "q=$SAMPLE_ITEM" \
            --data-urlencode "search_type=items" \
            http://localhost:8080/pages/search.php)

          if printf '%s' "$ITEM_RESPONSE" |
            grep -Fq "$SAMPLE_ITEM" &&
            ! printf '%s' "$ITEM_RESPONSE" |
              grep -Fq "No listings found"
          then
            echo "PASSED: Item Search returned the seeded listing."
          else
            echo "FAILED: Item Search did not return expected listing: $SAMPLE_ITEM"
            failures=1
          fi

          # =========================================
          # UC-17: Item Search - partial match
          # =========================================

          echo
          echo "=== Testing partial Item Search ==="

          PARTIAL_ITEM_RESPONSE=$(curl -sSfG \
            --data-urlencode "q=$PARTIAL_ITEM" \
            --data-urlencode "search_type=items" \
            http://localhost:8080/pages/search.php)

          if printf '%s' "$PARTIAL_ITEM_RESPONSE" |
            grep -Fq "$SAMPLE_ITEM"
          then
            echo "PASSED: Partial Item Search returned the expected listing."
          else
            echo "FAILED: Partial Item Search did not return expected listing: $SAMPLE_ITEM"
            failures=1
          fi

          # =========================================
          # UC-17: Item Search - no results
          # =========================================

          echo
          echo "=== Testing Item Search empty state ==="

          ITEM_EMPTY_RESPONSE=$(curl -sSfG \
            --data-urlencode "q=ci-no-such-item-948372" \
            --data-urlencode "search_type=items" \
            http://localhost:8080/pages/search.php)

          if printf '%s' "$ITEM_EMPTY_RESPONSE" |
            grep -Fq "No listings found"
          then
            echo "PASSED: Item Search displays the no-results state."
          else
            echo "FAILED: Item Search no-results state was not displayed."
            failures=1
          fi

          # =========================================
          # UC-17: Item Search - inactive item excluded
          # =========================================

          echo
          echo "=== Testing inactive item search exclusion ==="

          if [ -n "$INACTIVE_ITEM" ]; then
            INACTIVE_ITEM_RESPONSE=$(curl -sSfG \
              --data-urlencode "q=$INACTIVE_ITEM" \
              --data-urlencode "search_type=items" \
              http://localhost:8080/pages/search.php)

            if printf '%s' "$INACTIVE_ITEM_RESPONSE" |
              grep -Fq "No listings found"
            then
              echo "PASSED: Item Search excludes inactive listing: $INACTIVE_ITEM"
            else
              echo "FAILED: Searching for inactive listing did not produce the expected no-results state: $INACTIVE_ITEM"
              failures=1
            fi
          else
            echo "SKIPPED: No inactive seeded listing available."
          fi

          # =========================================
          # UC-18: Seller Search - success
          # =========================================

          echo
          echo "=== Testing Seller Search ==="

          SELLER_RESPONSE=$(curl -sSfG \
            --data-urlencode "q=$SAMPLE_SELLER" \
            --data-urlencode "search_type=seller_profiles" \
            http://localhost:8080/pages/search.php)

          if printf '%s' "$SELLER_RESPONSE" |
            grep -Fq "$SAMPLE_SELLER" &&
            ! printf '%s' "$SELLER_RESPONSE" |
              grep -Fq "No sellers found"
          then
            echo "PASSED: Seller Search returned the seeded seller."
          else
            echo "FAILED: Seller Search did not return expected seller: $SAMPLE_SELLER"
            failures=1
          fi

          # =========================================
          # UC-18: Seller Search - partial match
          # =========================================

          echo
          echo "=== Testing partial Seller Search ==="

          PARTIAL_SELLER_RESPONSE=$(curl -sSfG \
            --data-urlencode "q=$PARTIAL_SELLER" \
            --data-urlencode "search_type=seller_profiles" \
            http://localhost:8080/pages/search.php)

          if printf '%s' "$PARTIAL_SELLER_RESPONSE" |
            grep -Fq "$SAMPLE_SELLER"
          then
            echo "PASSED: Partial Seller Search returned the expected seller."
          else
            echo "FAILED: Partial Seller Search did not return expected seller: $SAMPLE_SELLER"
            failures=1
          fi

          # =========================================
          # UC-18: Seller Search - no results
          # =========================================

          echo
          echo "=== Testing Seller Search empty state ==="

          SELLER_EMPTY_RESPONSE=$(curl -sSfG \
            --data-urlencode "q=ci-no-such-seller-948372" \
            --data-urlencode "search_type=seller_profiles" \
            http://localhost:8080/pages/search.php)

          if printf '%s' "$SELLER_EMPTY_RESPONSE" |
            grep -Fq "No sellers found"
          then
            echo "PASSED: Seller Search displays the no-results state."
          else
            echo "FAILED: Seller Search no-results state was not displayed."
            failures=1
          fi

          # =========================================
          # UC-18: Inactive seller excluded
          # =========================================

          echo
          echo "=== Testing inactive seller exclusion ==="

          if [ -n "$INACTIVE_SELLER" ]; then
            INACTIVE_SELLER_RESPONSE=$(curl -sSfG \
              --data-urlencode "q=$INACTIVE_SELLER" \
              --data-urlencode "search_type=seller_profiles" \
              http://localhost:8080/pages/search.php)

            if printf '%s' "$INACTIVE_SELLER_RESPONSE" |
              grep -Fq "No sellers found"
            then
              echo "PASSED: Seller Search excludes inactive seller: $INACTIVE_SELLER"
            else
              echo "FAILED: Searching for inactive seller did not produce the expected no-results state: $INACTIVE_SELLER"
              failures=1
            fi
          else
            echo "SKIPPED: No inactive seeded seller available."
          fi

          # =========================================
          # UC-18: Seller Search privacy regression
          # =========================================

          echo
          echo "=== Testing Seller Search privacy ==="

          PRIVATE_PASSWORD_HASH=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT password_hash
             FROM users
             WHERE user_id = $SAMPLE_SELLER_USER_ID;")

          PRIVATE_BIRTH_DATE=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT birth_date
             FROM users
             WHERE user_id = $SAMPLE_SELLER_USER_ID;")

          PRIVATE_PAYOUT_REFERENCE=$(docker exec omnibuy-db \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u root \
            -p"$MYSQL_ROOT_PASSWORD" \
            -D "$MYSQL_DATABASE" \
            -Nse \
            "SELECT payout_account_reference
             FROM seller_profiles
             WHERE user_id = $SAMPLE_SELLER_USER_ID;")

          privacy_failure=0

          if [ -n "$PRIVATE_PASSWORD_HASH" ] &&
            printf '%s' "$SELLER_RESPONSE" |
              grep -Fq "$PRIVATE_PASSWORD_HASH"
          then
            echo "FAILED: Seller Search exposed the seller password hash."
            privacy_failure=1
          fi

          if [ -n "$PRIVATE_BIRTH_DATE" ] &&
            printf '%s' "$SELLER_RESPONSE" |
              grep -Fq "$PRIVATE_BIRTH_DATE"
          then
            echo "FAILED: Seller Search exposed the seller birth date."
            privacy_failure=1
          fi

          if [ -n "$PRIVATE_PAYOUT_REFERENCE" ] &&
            printf '%s' "$SELLER_RESPONSE" |
              grep -Fq "$PRIVATE_PAYOUT_REFERENCE"
          then
            echo "FAILED: Seller Search exposed the seller payout account reference."
            privacy_failure=1
          fi

          # Also guard against accidentally rendering internal field names.
          if printf '%s' "$SELLER_RESPONSE" |
            grep -Eqi 'password_hash|payout_account_reference|birth_date'
          then
            echo "FAILED: Seller Search exposed a restricted account field name."
            privacy_failure=1
          fi

          if [ "$privacy_failure" -ne 0 ]; then
            failures=1
          else
            echo "PASSED: Seller Search does not expose restricted seller data."
          fi

          # =========================================
          # Final result
          # =========================================

          echo

          if [ "$failures" -ne 0 ]; then
            echo "One or more Marketplace Discovery feature or regression tests failed."
            exit 1
          fi

          echo "All Marketplace Discovery feature and regression tests passed."

      # Runs last: it restarts the containers and briefly stops the database.
      - name: Docker environment tests (persistence, healthcheck, source mount, connectivity)
        run: |
          bash tests/environment/docker-environment-test.sh

      - name: Diagnose failure
        if: failure()
        run: |
          echo "=== Container status ==="
          docker ps -a

          echo "=== Database state ==="
          docker inspect omnibuy-db \
            --format='Status={{.State.Status}} Health={{.State.Health.Status}}'

          echo "=== Listening ports ==="
          docker exec omnibuy-db sh -c \
            'ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null || true'

          echo "=== MySQL logs ==="
          docker logs omnibuy-db --tail 200

          echo "=== Full compose logs ==="
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --remove-orphans
