name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: omnibuy
      MYSQL_USER: omnibuy_user
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l


      - name: Run automated PHP tests
        run: php tests/create-listing-test.php


      - name: Build Docker containers
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d

      - name: Check container status
        run: |
          failed=0

          for id in $(docker compose ps -a -q); do
            status=$(docker inspect -f '{{.State.Status}}' "$id")
            name=$(docker inspect -f '{{.Name}}' "$id")

            echo "$name: $status"

            if [ "$status" != "running" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more containers are not running."
            docker compose logs
            exit 1
          fi

      - name: Show container status # Remove later once stable
        run: docker compose ps -a   # -a shows all containers including stopped ones

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker containers
        if: always()
        run: docker compose down --remove-orphans